dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # Añadir esta línea

# Añadir la configuración para los iconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#FFFFFF" # solo para Android 8.0+
  adaptive_icon_foreground: "assets/images/logo.jpeg" # solo para Android 8.0+
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg